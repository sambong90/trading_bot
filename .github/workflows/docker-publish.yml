name: Build & Push to GHCR

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build and push Docker image
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          IMAGE="ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')"
          SHA7=$(echo '${{ github.sha }}' | cut -c1-7)
          echo "$GITHUB_TOKEN" | docker login ghcr.io -u '${{ github.actor }}' --password-stdin
          docker build --platform linux/amd64 \
            -t "${IMAGE}:latest" \
            -t "${IMAGE}:${SHA7}" \
            -f Dockerfile .
          docker push "${IMAGE}:latest"
          docker push "${IMAGE}:${SHA7}"
          echo "IMAGE=${IMAGE}" >> $GITHUB_ENV
          echo "SHA7=${SHA7}" >> $GITHUB_ENV

      - name: Image digest summary
        run: |
          echo "### Docker Image Published" >> $GITHUB_STEP_SUMMARY
          echo "| Tag | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| latest | \`${IMAGE}:latest\` |" >> $GITHUB_STEP_SUMMARY
          echo "| sha | \`${IMAGE}:${SHA7}\` |" >> $GITHUB_STEP_SUMMARY

  deploy:
    name: Deploy to Kubernetes
    needs: build-and-push
    runs-on: self-hosted

    steps:
      - name: Rollout restart
        run: kubectl rollout restart deployment/trading-bot -n quant-bot

      - name: Wait for rollout
        run: kubectl rollout status deployment/trading-bot -n quant-bot --timeout=180s

      - name: Deployment summary
        run: |
          echo "### Kubernetes Deployment" >> $GITHUB_STEP_SUMMARY
          echo "| 항목 | 값 |" >> $GITHUB_STEP_SUMMARY
          echo "|------|-----|" >> $GITHUB_STEP_SUMMARY
          echo "| Namespace | quant-bot |" >> $GITHUB_STEP_SUMMARY
          echo "| Deployment | trading-bot |" >> $GITHUB_STEP_SUMMARY
          echo "| Commit | ${{ github.sha }} |" >> $GITHUB_STEP_SUMMARY
          POD_INFO=$(kubectl get pod -n quant-bot -l app.kubernetes.io/name=trading-bot \
            --no-headers -o custom-columns='NAME:.metadata.name,STATUS:.status.phase,READY:.status.containerStatuses[0].ready' 2>/dev/null || echo "조회 실패")
          echo "| Pod 상태 | ${POD_INFO} |" >> $GITHUB_STEP_SUMMARY
